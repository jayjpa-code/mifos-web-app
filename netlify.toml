[build]
  command = "npm ci && npm run build && node scripts/netlify-env.js"
  publish = "dist/web-app/browser"

[build.environment]
  NODE_VERSION = "24.16.0"
  NPM_FLAGS = "--no-audit --no-fund"

  # Public browser runtime connection to the KoreNXT Fineract service on Render.
  FINERACT_API_URL = "https://korenxt-fineract.onrender.com"
  FINERACT_API_URLS = "https://korenxt-fineract.onrender.com"
  FINERACT_API_PROVIDER = "/fineract-provider/api"
  FINERACT_API_VERSION = "/v1"
  FINERACT_API_ACTUATOR = "/fineract-provider"
  FINERACT_PLATFORM_TENANT_IDENTIFIER = "default"
  FINERACT_PLATFORM_TENANTS_IDENTIFIER = "default"
  MIFOS_ALLOW_SERVER_SWITCH_SELECTOR = "false"
  MIFOS_DISPLAY_TENANT_SELECTOR = "false"
  MIFOS_DISPLAY_BACKEND_INFO = "true"
  MIFOS_DEFAULT_LANGUAGE = "en-US"

# Angular currently uses hash-based routing, but this fallback also protects
# future migration to path-based routes and direct deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
